name: Backend Deployment (Render / Vercel)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target hosting platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - render
          - vercel

jobs:
  # -------------------------------------------------------------
  # Job 1: Deploy to Render Web Service via Deploy Hook
  # -------------------------------------------------------------
  deploy-render:
    name: Deploy to Render
    if: github.event.inputs.target_platform != 'vercel'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render webhook deployment..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy signal dispatched successfully."

  # -------------------------------------------------------------
  # Job 2: Deploy to Vercel Serverless
  # -------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel
    if: github.event.inputs.target_platform != 'render'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Vercel CLI
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        working-directory: backend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build & Deploy Backend to Vercel Production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        working-directory: backend
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
